{% extends "base.html" %}
{% load static %}

{% block page_content %}
<div class="page-template-container">
<div class="mb-4">
    <h1 class="page-title-header">{{ page_title }}</h1>
    <ul class="flex flex-col mb-4 gap-6">
        {% for entry in essays %}
        <li class="w-full flex flex-row relative">
            <div class="w-10 h-10 mr-4 rounded-lg overflow-hidden border border-border-color p-[1px] shrink-0">
                <img src="{% if blog_author_avatar %}{{ blog_author_avatar.url }}{% elif site.site_avatar %}{{ site.site_avatar.url }}{% else %}{% static 'images/redefine-avatar.svg' %}{% endif %}" class="w-full h-full rounded-[6.2px]">
            </div>
            <div class="w-full border-border-color rounded-xl rounded-tl-none shadow-redefine-flat overflow-hidden">
                <div class="essay-date px-4 py-1.5 text-sm border-b border-border-color bg-zinc-50 dark:bg-zinc-800 text-third-text-color" data-date="{{ entry.essay.created_at|date:'c' }}">
                    Loading Date...
                </div>
                <div id="shuoshuo-content" class="px-4 py-2">{{ entry.html }}</div>
            </div>
            <div class="absolute left-[50.5px] top-3 transform w-2 h-2 border-solid border-t border-l bg-zinc-50 -rotate-45 border-border-color dark:bg-zinc-800"></div>
        </li>
        {% endfor %}
    </ul>
</div>
<div class="page-template-content markdown-body"></div>
</div>
{% endblock %}
