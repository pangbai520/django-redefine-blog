{% load i18n %}<!doctype html>
<html lang="{{ language_code|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    @media (prefers-color-scheme: dark) {
      .mail-body { background: #202124 !important; color: #d2d2d7 !important; }
      .mail-card { background: #242529 !important; border-color: rgba(255,255,255,.12) !important; }
      .mail-muted { color: #9595a2 !important; }
    }
  </style>
</head>
<body class="mail-body" style="margin:0;padding:24px;background:#f5f7fb;color:#323739;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <div class="mail-card" style="box-sizing:border-box;max-width:600px;margin:16px auto;padding:32px;background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:18px">
    <p style="margin:0 0 12px;font-size:13px;color:{{ site.colour_primary }};font-weight:700;letter-spacing:.04em">{{ site.site_name }}</p>
    <h1 style="margin:0 0 20px;color:{{ site.colour_primary }};font-size:24px;line-height:1.3">{% translate "Reset password" %}</h1>
    <p style="margin:0;font-size:15px;line-height:1.75">{% translate "Someone requested a password reset for your comment account." %}</p>
    <p style="margin:28px 0">
      <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:11px 20px;border-radius:9px;background:{{ site.colour_primary }};color:#fff;text-decoration:none;font-weight:700">{% translate "Choose a new password" %}</a>
    </p>
    <p class="mail-muted" style="margin:0;font-size:13px;color:#6b7280;line-height:1.65">{% translate "If you did not create this account, you can safely ignore this email." %}</p>
  </div>
</body>
</html>
