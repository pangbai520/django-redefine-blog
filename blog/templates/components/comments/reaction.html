{% load static i18n %}
<link rel="stylesheet" href="{% static 'css/article-reaction.css' %}">
<div class="article-reaction-container px-2 sm:px-6 md:px-8">
  <span hidden>{% csrf_token %}</span>
  <div class="wl-reaction"
       data-article-reaction
       data-api="{% url 'article_reactions' article.slug %}"
       data-path="{{ request.path }}">
    <div class="wl-reaction-title">{% translate "What do you think?" %}</div>
    <ul class="wl-reaction-list">
      <li class="wl-reaction-item" data-reaction-index="0">
        <div class="wl-reaction-img">
          <img src="https://unpkg.com/@waline/emojis/tieba/tieba_agree.png" alt="">
          <svg class="wl-reaction-loading" hidden aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid"><circle cx="50" cy="50" fill="none" stroke="currentColor" stroke-width="4" r="40" stroke-dasharray="85 30"><animateTransform attributeName="transform" type="rotate" repeatCount="indefinite" dur="1s" values="0 50 50;360 50 50" keyTimes="0;1"></animateTransform></circle></svg>
          <div class="wl-reaction-votes">0</div>
        </div>
        <div class="wl-reaction-text"></div>
      </li>
      <li class="wl-reaction-item" data-reaction-index="1">
        <div class="wl-reaction-img">
          <img src="https://unpkg.com/@waline/emojis/tieba/tieba_look_down.png" alt="">
          <svg class="wl-reaction-loading" hidden aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid"><circle cx="50" cy="50" fill="none" stroke="currentColor" stroke-width="4" r="40" stroke-dasharray="85 30"><animateTransform attributeName="transform" type="rotate" repeatCount="indefinite" dur="1s" values="0 50 50;360 50 50" keyTimes="0;1"></animateTransform></circle></svg>
          <div class="wl-reaction-votes">0</div>
        </div>
        <div class="wl-reaction-text"></div>
      </li>
      <li class="wl-reaction-item" data-reaction-index="2">
        <div class="wl-reaction-img">
          <img src="https://unpkg.com/@waline/emojis/tieba/tieba_sunglasses.png" alt="">
          <svg class="wl-reaction-loading" hidden aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid"><circle cx="50" cy="50" fill="none" stroke="currentColor" stroke-width="4" r="40" stroke-dasharray="85 30"><animateTransform attributeName="transform" type="rotate" repeatCount="indefinite" dur="1s" values="0 50 50;360 50 50" keyTimes="0;1"></animateTransform></circle></svg>
          <div class="wl-reaction-votes">0</div>
        </div>
        <div class="wl-reaction-text"></div>
      </li>
      <li class="wl-reaction-item" data-reaction-index="3">
        <div class="wl-reaction-img">

          <div class="wl-reaction-votes">0</div>
        </div>
        <div class="wl-reaction-text"></div>
      </li>
      <li class="wl-reaction-item" data-reaction-index="4">
        <div class="wl-reaction-img">
          <img src="https://unpkg.com/@waline/emojis/tieba/tieba_awkward.png" alt="">

        </div>

    </ul>
  </div>
</div>
<script src="{% static 'js/article-reaction.js' %}" defer data-swup-reload-script></script>
