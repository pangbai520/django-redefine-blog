{% extends "base.html" %}
{% load static %}
{% block page_content %}
<link rel="stylesheet" href="{% static 'css/internal-comments.css' %}">
<div class="page-template-container"><div class="page-template-content markdown-body">
  <h1>Reset password</h1>
  <p>Enter the email address used by your comment account. If it exists, a reset link will be sent.</p>
  <form method="post" class="internal-auth-form">{% csrf_token %}{{ form.as_p }}<button class="wl-btn primary" type="submit">Send reset link</button></form>
</div></div>
{% endblock %}
