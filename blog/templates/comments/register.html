{% extends "base.html" %}
{% load static i18n %}
{% block page_content %}
<link rel="stylesheet" href="{% static 'css/internal-comments.css' %}" />
<div class="page-template-container">
  <div class="page-template-content markdown-body">
    <h1>{% translate "Sign up" %}</h1>
    {% if registration_disabled %}
    <p>{% translate "Registration is currently disabled." %}</p>
    {% else %}
    <form method="post" class="internal-auth-form" data-register-form data-skip-preloader
          data-sending-label="{% translate 'Sending verification email…' %}">
      {% csrf_token %}{{ form.as_p }}
      <input type="hidden" name="next" value="{{ request.GET.next }}" /><button
        class="wl-btn"
        type="submit"
      >
        <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
        <span>{% translate "Sign up" %}</span>
      </button>
    </form>
    {% endif %}
  </div>
</div>
<script src="{% static 'js/register.js' %}" defer data-swup-reload-script></script>
{% endblock %}
