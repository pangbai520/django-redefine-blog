{% extends "base.html" %}
{% load static i18n %}
{% block page_content %}<link rel="stylesheet" href="{% static 'css/internal-comments.css' %}"><div class="page-template-container"><div class="page-template-content markdown-body"><h1>{% translate "Choose a new password" %}</h1>{% if validlink %}<form method="post" class="internal-auth-form" data-skip-preloader data-pending-label="{% translate 'Saving…' %}">{% csrf_token %}{{ form.as_p }}<button class="wl-btn primary" type="submit">{% translate "Save password" %}</button></form>{% else %}<p>{% translate "This reset link is invalid or has expired. Please request a new one." %}</p>{% endif %}</div></div>{% endblock %}
