name: Bug report
description: Report a reproducible problem in the Django port
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to provide a reproducible report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest set of steps, URLs and sample content needed to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: vX.Y.Z or commit SHA
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
        - MySQL
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, browser and operating system
      placeholder: Python 3.12, Firefox 140, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, email addresses and private site data before pasting logs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials and private data from this report.
          required: true
        - label: I checked that this problem belongs to the Django port rather than upstream Redefine.
          required: true
