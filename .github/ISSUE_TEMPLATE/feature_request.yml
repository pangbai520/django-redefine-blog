name: Feature request
description: Propose a focused addition or behavior change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation are you running into?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and how readers or maintainers would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing extensions or deployment options that almost solve the problem.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is useful to the reusable project, not only to one site's private configuration.
          required: true
