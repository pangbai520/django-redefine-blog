services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DB_ENGINE: postgresql
      DB_HOST: database
      DB_PORT: 5432
      CACHE_BACKEND: redis
      CACHE_URL: redis://cache:6379/1
      STATIC_ROOT: /srv/django-redefine-blog/static
      MEDIA_ROOT: /srv/django-redefine-blog/media
      DJANGO_LOG_DIR: /srv/django-redefine-blog/logs
      DJANGO_TRUST_PROXY_PROTO: "1"
    volumes:
      - static_data:/srv/django-redefine-blog/static
      - media_data:/srv/django-redefine-blog/media
      - log_data:/srv/django-redefine-blog/logs
    expose: ["8000"]
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/django-redefine-blog/static:ro
      - media_data:/srv/django-redefine-blog/media:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header=X-Forwarded-Proto: https", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-django_blog}
      POSTGRES_USER: ${DB_USER:-django_blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  log_data:
